changelog:
  exclude:
    labels:
      - ignore-for-release
      - skip-changelog
  categories:
    - title: "✨ Features"
      labels:
        - enhancement
        - feat
        - feature
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
        - bugfix
    - title: "📚 Documentation"
      labels:
        - documentation
        - docs
    - title: "🔧 Maintenance & Other Changes"
      labels:
        - "*"
