name: Release Binaries (Windows, Linux, macOS)

on:
  release:
    types: [created, published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-notes:
    name: Generate Release Notes
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and update GitHub Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          git fetch --tags --force
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG}"
          else
            RANGE="${TAG}"
          fi

          FEATURES=""
          FIXES=""
          REFACTORS=""
          DOCS=""
          OTHERS=""
          FEAT_RE="^feat(\(([^)]+)\))?!?:[[:space:]]*(.+)$"
          FIX_RE="^fix(\(([^)]+)\))?!?:[[:space:]]*(.+)$"
          REF_RE="^(perf|refactor)(\(([^)]+)\))?!?:[[:space:]]*(.+)$"
          DOCS_RE="^docs(\(([^)]+)\))?!?:[[:space:]]*(.+)$"
          FULL_CHANGELOG_RE="^\*\*Full Changelog\*\*:"

          while IFS='|' read -r HASH SUBJECT; do
            [ -z "$HASH" ] && continue
            LINK="([\`${HASH}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${HASH}))"

            if [[ "$SUBJECT" =~ $FEAT_RE ]]; then
              SCOPE="${BASH_REMATCH[2]}"
              MSG="${BASH_REMATCH[3]}"
              if [ -n "$SCOPE" ]; then
                FEATURES+="- **${SCOPE}**: ${MSG} ${LINK}"$'\n'
              else
                FEATURES+="- ${MSG} ${LINK}"$'\n'
              fi
            elif [[ "$SUBJECT" =~ $FIX_RE ]]; then
              SCOPE="${BASH_REMATCH[2]}"
              MSG="${BASH_REMATCH[3]}"
              if [ -n "$SCOPE" ]; then
                FIXES+="- **${SCOPE}**: ${MSG} ${LINK}"$'\n'
              else
                FIXES+="- ${MSG} ${LINK}"$'\n'
              fi
            elif [[ "$SUBJECT" =~ $REF_RE ]]; then
              SCOPE="${BASH_REMATCH[3]}"
              MSG="${BASH_REMATCH[4]}"
              if [ -n "$SCOPE" ]; then
                REFACTORS+="- **${SCOPE}**: ${MSG} ${LINK}"$'\n'
              else
                REFACTORS+="- ${MSG} ${LINK}"$'\n'
              fi
            elif [[ "$SUBJECT" =~ $DOCS_RE ]]; then
              SCOPE="${BASH_REMATCH[2]}"
              MSG="${BASH_REMATCH[3]}"
              if [ -n "$SCOPE" ]; then
                DOCS+="- **${SCOPE}**: ${MSG} ${LINK}"$'\n'
              else
                DOCS+="- ${MSG} ${LINK}"$'\n'
              fi
            else
              OTHERS+="- ${SUBJECT} ${LINK}"$'\n'
            fi
          done < <(git log "$RANGE" --no-merges --pretty=format:"%h|%s")

          {
            echo "<!-- auto-release-notes -->"
            echo "## What's Changed in ${TAG}"
            echo ""
            if [ -n "$FEATURES" ]; then
              echo "### ✨ Features"
              printf "%s\n" "$FEATURES"
            fi
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              printf "%s\n" "$FIXES"
            fi
            if [ -n "$REFACTORS" ]; then
              echo "### ⚡ Refactoring & Performance"
              printf "%s\n" "$REFACTORS"
            fi
            if [ -n "$DOCS" ]; then
              echo "### 📚 Documentation"
              printf "%s\n" "$DOCS"
            fi
            if [ -n "$OTHERS" ]; then
              echo "### 🔧 Other Changes"
              printf "%s\n" "$OTHERS"
            fi

            echo "### 📦 Prebuilt Binaries"
            echo ""
            echo "| Platform | Archive / Bundle |"
            echo "| :--- | :--- |"
            echo "| **macOS (Apple Silicon)** | \`loxone-portable-macos-aarch64-app.zip\` (\`.app\` bundle) / \`.tar.gz\` |"
            echo "| **macOS (Intel)** | \`loxone-portable-macos-x86_64-app.zip\` (\`.app\` bundle) / \`.tar.gz\` |"
            echo "| **Windows (x86_64)** | \`loxone-portable-windows-x86_64.zip\` |"
            echo "| **Linux (x86_64)** | \`loxone-portable-linux-x86_64.tar.gz\` |"
            echo ""

            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
            else
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}"
            fi
          } > generated_notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTING_BODY="$(gh release view "$TAG" --json body -q .body || true)"
            TRIMMED="$(printf "%s" "$EXISTING_BODY" | tr -d '[:space:]')"
            if [ -z "$TRIMMED" ] || [[ "$EXISTING_BODY" == *"<!-- auto-release-notes -->"* ]] || [[ "$EXISTING_BODY" =~ $FULL_CHANGELOG_RE ]]; then
              cp generated_notes.md release_notes.md
            else
              {
                printf "%s\n\n---\n\n" "$EXISTING_BODY"
                cat generated_notes.md
              } > release_notes.md
            fi
            gh release edit "$TAG" --notes-file release_notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file generated_notes.md
          fi

  build-release:
    name: Build (${{ matrix.artifact_name }})
    needs: [release-notes]
    if: >-
      always() &&
      (needs.release-notes.result == 'success' || needs.release-notes.result == 'skipped') &&
      (github.event_name != 'release' || github.event.action == 'published')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: loxone-portable-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: loxone-portable-windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: loxone-portable-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: loxone-portable-macos-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libgtk-3-dev \
            libasound2-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked -p loxone-gui --target ${{ matrix.target }}

      - name: Package Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist staging
          cp "target/${{ matrix.target }}/release/loxone-gui" "staging/loxone-portable"
          chmod +x "staging/loxone-portable"
          tar -C staging -czf "dist/${{ matrix.artifact_name }}.tar.gz" loxone-portable
          (cd dist && sha256sum "${{ matrix.artifact_name }}.tar.gz" > "${{ matrix.artifact_name }}.tar.gz.sha256")

      - name: Package macOS archive and .app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist staging
          cp "target/${{ matrix.target }}/release/loxone-gui" "staging/loxone-portable"
          chmod +x "staging/loxone-portable"
          tar -C staging -czf "dist/${{ matrix.artifact_name }}.tar.gz" loxone-portable

          APP_DIR="staging/Loxone Portable.app/Contents"
          mkdir -p "$APP_DIR/MacOS" "$APP_DIR/Resources"
          cp "staging/loxone-portable" "$APP_DIR/MacOS/loxone-portable"
          cat > "$APP_DIR/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Loxone Portable</string>
            <key>CFBundleDisplayName</key>
            <string>Loxone Portable</string>
            <key>CFBundleIdentifier</key>
            <string>io.loxone-portable.app</string>
            <key>CFBundleVersion</key>
            <string>0.1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>loxone-portable</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          (cd staging && ditto -c -k --sequesterRsrc --keepParent "Loxone Portable.app" "../dist/${{ matrix.artifact_name }}-app.zip")
          (cd dist && shasum -a 256 "${{ matrix.artifact_name }}.tar.gz" > "${{ matrix.artifact_name }}.tar.gz.sha256")
          (cd dist && shasum -a 256 "${{ matrix.artifact_name }}-app.zip" > "${{ matrix.artifact_name }}-app.zip.sha256")

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/loxone-gui.exe" "staging/loxone-portable.exe"
          Compress-Archive -Path "staging/loxone-portable.exe" -DestinationPath "dist/${{ matrix.artifact_name }}.zip" -Force
          $hash = (Get-FileHash "dist/${{ matrix.artifact_name }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact_name }}.zip" | Out-File -Encoding ascii "dist/${{ matrix.artifact_name }}.zip.sha256"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

      - name: Attach binaries to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*
