[package]
name = "loxone-core"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.22"
indexmap = "2.7"
quick-xml = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
suppaftp = "6.0"
thiserror = "2.0"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
