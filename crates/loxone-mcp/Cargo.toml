[package]
name = "loxone-mcp"
version.workspace = true
edition.workspace = true

[[bin]]
name = "loxone-mcp"
path = "src/main.rs"

[dependencies]
loxone-core = { path = "../loxone-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
