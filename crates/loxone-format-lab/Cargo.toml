[package]
name = "loxone-format-lab"
version.workspace = true
edition.workspace = true
description = "Reverse-engineering toolkit for Loxone .Loxone / .LoxCC project files"

[lib]
name = "loxone_format_lab"
path = "src/lib.rs"

[[bin]]
name = "loxone-format-lab"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
loxone-core = { path = "../loxone-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
